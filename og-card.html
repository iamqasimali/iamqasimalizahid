<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@500&display=swap">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#fff;font-family:Inter,sans-serif;color:#0f1012;display:grid;grid-template-columns:1fr 400px;overflow:hidden}
.l{padding:64px 0 56px 72px;display:flex;flex-direction:column;justify-content:space-between}
.logo{font-family:'General Sans';font-weight:600;font-size:28px;letter-spacing:-.02em}
h1{font-family:'General Sans';font-weight:500;font-size:104px;line-height:.92;letter-spacing:-.045em}
.role{margin-top:28px;font-size:30px;color:#63676f}
.tags{display:flex;gap:10px;flex-wrap:wrap}
.tags span{border:1px solid #e6e6e6;border-radius:999px;padding:8px 16px;font-size:20px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#6cd5cb;margin-right:10px;vertical-align:middle}
.r{background:#e9e9e9;display:flex;align-items:center;justify-content:center;padding:40px}
.r img{width:300px;aspect-ratio:832/1150;object-fit:cover;object-position:top;border-radius:28px;box-shadow:0 30px 60px rgba(15,16,18,.2)}
</style></head><body>
<div class="l">
  <div class="logo">Qasim.Z</div>
  <div><h1>Qasim Ali<br>Zahid</h1><p class="role"><span class="dot"></span>Senior Full Stack Engineer · Lahore, Pakistan</p></div>
  <div class="tags"><span>Ruby on Rails</span><span>React</span><span>TypeScript</span><span>PostgreSQL</span><span>AI &amp; MCP</span></div>
</div>
<div class="r"><img src="/src/assets/images/qasim-portrait.jpg" alt=""></div>
</body></html>
